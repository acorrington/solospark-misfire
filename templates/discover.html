{% extends "base.html" %}
{% block title %}SoloSpark — Discover Leads{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Discover New Leads</h1>

<form id="discover-form" class="flex flex-wrap items-end gap-3 mb-6 bg-white rounded-lg shadow p-4">
  <label class="text-sm grow">
    <span class="block text-slate-500 mb-1">Search query</span>
    <input type="text" name="query" required placeholder="e.g. plumbers in Eugene OR"
           class="border rounded px-2 py-1.5 text-sm w-full min-w-[280px]">
  </label>
  <label class="text-sm">
    <span class="block text-slate-500 mb-1">Max results</span>
    <input type="number" name="limit" min="1" max="100" placeholder="All"
           class="border rounded px-2 py-1.5 text-sm w-24">
  </label>
  <button type="submit" id="discover-btn"
          class="bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded hover:bg-slate-700 transition">Search</button>
</form>

<div id="discover-error" class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-4"></div>

<div id="discover-results" class="hidden">
  <p id="discover-summary" class="text-sm font-medium mb-3"></p>
  <div class="bg-white rounded-lg shadow overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 text-left text-slate-500 uppercase text-xs tracking-wide">
        <tr>
          <th class="px-4 py-3">Business</th>
          <th class="px-4 py-3">Category</th>
          <th class="px-4 py-3">Address</th>
          <th class="px-4 py-3">Website</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="discover-rows" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById("discover-form");
  var errorBox = document.getElementById("discover-error");
  var resultsBox = document.getElementById("discover-results");
  var summary = document.getElementById("discover-summary");
  var rows = document.getElementById("discover-rows");
  var btn = document.getElementById("discover-btn");

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var query = form.querySelector("[name=query]").value.trim();
    var limitRaw = form.querySelector("[name=limit]").value;
    var payload = { query: query };
    if (limitRaw) payload.limit = parseInt(limitRaw, 10);

    btn.disabled = true;
    btn.textContent = "Searching\u2026";
    errorBox.classList.add("hidden");
    resultsBox.classList.add("hidden");

    fetch("/api/discover", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      })
      .then(function (result) {
        if (!result.ok) {
          errorBox.textContent = result.data.detail || "Discovery failed";
          errorBox.classList.remove("hidden");
          return;
        }
        var data = result.data;
        summary.textContent = "Discovered " + data.found + " place(s); " +
          data.new_leads.length + " new lead(s) added to the ledger.";
        rows.innerHTML = "";
        data.new_leads.forEach(function (lead) {
          var tr = document.createElement("tr");
          tr.className = "hover:bg-slate-50";
          tr.innerHTML =
            '<td class="px-4 py-3"><div class="font-medium">' + escapeHtml(lead.name) + "</div>" +
            '<div class="text-xs text-slate-400">' + escapeHtml(lead.slug) + "</div></td>" +
            '<td class="px-4 py-3">' + escapeHtml(lead.category || "\u2014") + "</td>" +
            '<td class="px-4 py-3">' + escapeHtml(lead.address || "\u2014") + "</td>" +
            "<td class=\"px-4 py-3\">" + (lead.website
              ? '<a href="' + escapeHtml(lead.website) + '" target="_blank" rel="noopener" class="text-blue-600 hover:underline">' +
                escapeHtml(lead.website.replace(/^https?:\/\//, "")) + "</a>"
              : '<span class="text-red-600 font-medium text-xs">No website</span>') + "</td>" +
            '<td class="px-4 py-3 text-right"><a href="/review/' + lead.id + '" class="text-blue-600 hover:underline">Review</a></td>';
          rows.appendChild(tr);
        });
        if (!data.new_leads.length) {
          var tr = document.createElement("tr");
          tr.innerHTML = '<td colspan="5" class="px-4 py-8 text-center text-slate-400">No new leads \u2014 every place found is already in the ledger.</td>';
          rows.appendChild(tr);
        }
        resultsBox.classList.remove("hidden");
      })
      .catch(function (err) {
        errorBox.textContent = "Request failed: " + err;
        errorBox.classList.remove("hidden");
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "Search";
      });
  });
})();
</script>
{% endblock %}
